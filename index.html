<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerdas Cermat Hitung</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ff;--ink:#17153b;--card:#fff;--line:#d9d5f5;--mute:#5b5890;--ok:#12a150;--no:#d8353a;--t0:#e4572e;--t1:#f2a900;--t2:#17a398;--tt0:#fff;--tt1:#17153b;--tt2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15133a;--ink:#f1efff;--card:#221f57;--line:#3a3680;--mute:#a9a5e0}}
:root[data-theme="dark"]{--bg:#15133a;--ink:#f1efff;--card:#221f57;--line:#3a3680;--mute:#a9a5e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Rubik,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
[hidden]{display:none!important}
h1{font-size:28px;margin:8px 0 4px;font-weight:800}
.sub{color:var(--mute);margin:0 0 12px}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:center;margin-top:8px}
.tm i{width:14px;height:44px;border-radius:6px;background:var(--c)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--t1);outline-offset:2px}
.big{width:100%;font-size:20px;margin-top:12px;padding:16px}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);padding:8px 12px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.bar b{font-size:18px}
.tg{display:inline-block;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 10px;font-size:13px;margin-left:6px}
.timer{display:flex;align-items:center;gap:12px;margin-top:10px}
#tn{font-size:56px;font-weight:800;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.trk{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
#tf{height:100%;background:var(--ok);transition:width .1s linear}
#tf.low{background:var(--no)}
.qc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 10px;text-align:center;margin:12px 0}
#q{font-size:clamp(34px,11vw,64px);font-weight:800}
#rv{margin-top:8px;font-size:24px;color:var(--ok);font-weight:800}
#st{min-height:44px;text-align:center;font-weight:700}
#ans{background:var(--card);border:3px solid var(--c,var(--ink));border-radius:14px;padding:12px;margin-bottom:12px}
#ans .row{grid-template-columns:1fr auto;align-items:center}
#inp{font-size:28px;text-align:center}
.bz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bz button{min-height:132px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 4px;background:var(--c);color:var(--tc)}
.bz .nm{font-size:15px;word-break:break-word}
.bz .sc{font-size:46px;font-weight:800;line-height:1}
.bz .lk{opacity:.35}
.bz .on{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--ink)}
.bz .lead .nm::before{content:"★ "}
.act{display:grid;gap:8px;margin-top:12px}
#ov{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;background:rgba(0,0,0,.4);z-index:9}
#ov.show{display:grid}
#ovc{width:min(60vw,260px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:min(40vw,170px);color:#fff;font-weight:800;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
#ovc.ok{background:var(--ok)}#ovc.no{background:var(--no)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){#ovc{animation:none}}
#key{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));z-index:8}
#key ol{columns:2;column-gap:20px;padding-left:34px;margin:12px 0}
#key li{padding:2px 0;break-inside:avoid}
.rw{display:flex;align-items:center;gap:12px;padding:16px;margin-top:8px;border-radius:14px;background:var(--c);color:var(--tc);font-size:22px;font-weight:800}
.rw span{margin-left:auto;font-size:32px}
</style></head><body><main>

<section id="setup">
<h1>Cerdas Cermat Hitung</h1>
<p class="sub">90 soal penjumlahan, pengurangan, perkalian, dan pembagian untuk 3 regu.</p>
<div class="tm" style="--c:var(--t0)"><i></i><input type="text" id="n0" value="Regu 1" aria-label="Nama regu 1"></div>
<div class="tm" style="--c:var(--t1)"><i></i><input type="text" id="n1" value="Regu 2" aria-label="Nama regu 2"></div>
<div class="tm" style="--c:var(--t2)"><i></i><input type="text" id="n2" value="Regu 3" aria-label="Nama regu 3"></div>
<div class="row"><div><label for="tq">Waktu soal (detik)</label><input type="number" id="tq" value="20" min="5"></div>
<div><label for="ta">Waktu menjawab (detik)</label><input type="number" id="ta" value="10" min="3"></div>
<div><label for="pp">Poin jika benar</label><input type="number" id="pp" value="10" min="1"></div>
<div><label for="pn">Pengurang jika salah</label><input type="number" id="pn" value="5" min="0"></div></div>
<label><input type="checkbox" id="sf" checked> Acak urutan soal (mudah dulu, lalu sedang)</label>
<button class="big" onclick="start()">Mulai lomba</button>
</section>

<section id="game" hidden>
<div class="bar"><div><b id="qno"></b><span class="tg" id="lv"></span></div>
<div><button class="ghost" id="mu" onclick="mute=!mute;this.textContent=mute?'Suara mati':'Suara nyala'">Suara nyala</button>
<button class="ghost" onclick="$('#key').hidden=false">Kunci</button>
<button class="ghost" onclick="if(confirm('Akhiri lomba sekarang?'))end()">Akhiri</button></div></div>
<div class="timer"><div id="tn">0</div><div class="trk"><div id="tf"></div></div></div>
<div class="qc"><div id="q"></div><div id="rv" hidden></div></div>
<div id="st"></div>
<div id="ans" hidden><label for="inp" id="who" style="margin-top:0"></label>
<div class="row"><input type="text" id="inp" inputmode="numeric" autocomplete="off" onkeydown="if(event.key=='Enter')submit()"><button onclick="submit()">Jawab</button></div></div>
<div class="bz">
<button id="b0" style="--c:var(--t0);--tc:var(--tt0)" onclick="buz(0)"><span class="nm"></span><span class="sc">0</span></button>
<button id="b1" style="--c:var(--t1);--tc:var(--tt1)" onclick="buz(1)"><span class="nm"></span><span class="sc">0</span></button>
<button id="b2" style="--c:var(--t2);--tc:var(--tt2)" onclick="buz(2)"><span class="nm"></span><span class="sc">0</span></button>
</div>
<div class="act"><button class="big" id="go" onclick="run()">Mulai timer</button><button class="big" id="nx" onclick="next()">Soal berikutnya</button></div>
</section>

<section id="end" hidden><h1>Hasil akhir</h1><div id="rk"></div><button class="big" onclick="location.reload()">Lomba baru</button></section>
</main>

<div id="ov"><div id="ovc"></div></div>
<div id="key" hidden><div class="bar"><b>Kunci jawaban (90 soal)</b><button class="ghost" onclick="$('#key').hidden=true">Tutup</button></div><ol id="kl"></ol></div>

<script>
const $=s=>document.querySelector(s);
const raw="25+38,74−29,6×7,56÷8,48+67,91−46,9×8,81÷9,135+64,200−85,12×5,96÷6,77+58,150−68,7×13,144÷12,29+46+15,100−37,15×4,84÷7,238+52,305−120,11×11,132÷11,64+79,120−47,8×14,105÷5,18+27+35,500−238,25×4,72÷4,346+154,83−59,16×6,195÷15,47+86,240−95,9×15,128÷8,365+135,410−175,13×7,169÷13,58+69,"+
"17×6,12×8+15,36+24÷6,3×25−18,324+478,1000−456,23×4+18,252÷6,18×5−27,480÷12+35,15×12,625−389,7×9+8×4,756+289,360÷15,20×6−45÷9,1200−875,25×12,441÷21,14×15−60,537+286,48×5,900÷45+30,16×9−34,2000−1375,19×7,288÷16,8×12+9×6,678−349,35×8,36×5÷9,24×15,1500÷25,125+375+250,18×18,(45+55)×7,3000−1850,576÷24,64×5−130,27×13,(120−45)÷5,999+888,22×25,840÷35,(18+12)×(9−4)";
const Q=raw.split(",").map((t,i)=>({t,lv:i<45?"Mudah":"Sedang",a:Math.round(Function('"use strict";return '+t.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-"))())}));
let order,idx,sc,lock,cur=-1,ph="",left,aleft,cfg,names,msg="",AC,mute=false;
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
function tone(f,t,d,ty="sine",v=.3){if(!AC||mute)return;const n=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05)}
const bell=(f,t=0)=>{tone(f,t,1.3);tone(f*2.76,t,.7,"sine",.12);tone(f*5.4,t,.3,"sine",.05)};
const snd={good(){bell(880);bell(1318,.2);bell(1760,.4)},bad(){bell(196);tone(98,0,.5,"sawtooth",.12);bell(147,.28)},tick(){tone(1000,0,.07,"square",.08)},up(){tone(150,0,1.1,"sawtooth",.25)},buzz(){tone(520,0,.2,"square",.18);tone(780,.1,.25,"square",.14)}};

function start(){
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 names=[0,1,2].map(i=>$("#n"+i).value.trim()||"Regu "+(i+1));
 cfg={tq:+$("#tq").value||20,ta:+$("#ta").value||10,pp:+$("#pp").value||10,pn:+$("#pn").value||0};
 order=$("#sf").checked?sh(Q.slice(0,45)).concat(sh(Q.slice(45))):Q.slice();
 sc=[0,0,0];idx=0;
 $("#kl").innerHTML=Q.map(q=>"<li>"+q.t+" = <b>"+q.a+"</b></li>").join("");
 names.forEach((n,i)=>$("#b"+i+" .nm").textContent=n);
 $("#setup").hidden=true;$("#game").hidden=false;load()}
function load(){
 const q=order[idx];lock=[0,0,0];cur=-1;ph="ready";left=cfg.tq*10;msg="Siap? Bacakan soal, lalu mulai timer.";
 $("#qno").textContent="Soal "+(idx+1)+" dari "+order.length;$("#lv").textContent=q.lv;$("#q").textContent=q.t+" = ?";draw()}
function run(){AC&&AC.resume();ph="run";msg="Tekan tombol regu untuk menjawab!";draw()}
function buz(i){
 if(ph!="run"||lock[i])return;AC&&AC.resume();snd.buzz();cur=i;ph="ans";aleft=cfg.ta*10;msg=names[i]+" menjawab";
 $("#who").textContent="Jawaban "+names[i];$("#ans").style.setProperty("--c","var(--t"+i+")");$("#inp").value="";draw();$("#inp").focus()}
function submit(){
 if(ph!="ans")return;const v=$("#inp").value.trim().replace(",",".");if(v==="")return;
 if(Number(v)===order[idx].a){sc[cur]+=cfg.pp;flash(1);done(names[cur]+" benar! +"+cfg.pp)}else wrong()}
function wrong(){
 const i=cur;sc[i]=Math.max(0,sc[i]-cfg.pn);lock[i]=1;cur=-1;flash(0);
 if(lock.every(x=>x))done("Semua regu salah");else{ph="run";msg=names[i]+" salah. Regu lain boleh menekan tombol!"}draw()}
function done(m){ph="done";msg=m;$("#nx").textContent=idx==order.length-1?"Lihat hasil":"Soal berikutnya";$("#rv").textContent="Jawaban: "+order[idx].a;draw()}
function flash(ok){
 snd[ok?"good":"bad"]();$("#ovc").className=ok?"ok":"no";$("#ovc").textContent=ok?"✓":"✗";$("#ov").className="show";
 setTimeout(()=>$("#ov").className="",1300)}
function next(){idx++;idx>=order.length?end():load()}
function end(){
 ph="";$("#game").hidden=true;$("#end").hidden=false;
 $("#rk").innerHTML=[0,1,2].sort((a,b)=>sc[b]-sc[a]).map((i,k)=>'<div class="rw" style="--c:var(--t'+i+');--tc:var(--tt'+i+')"><b>'+(k+1)+'</b>'+esc(names[i])+'<span>'+sc[i]+'</span></div>').join("")}
function draw(){
 const t=ph=="ans"?aleft:left,tot=(ph=="ans"?cfg.ta:cfg.tq)*10,s=Math.ceil(t/10);
 $("#tn").textContent=s;$("#tf").style.width=(t/tot*100)+"%";
 $("#tf").className=(ph=="run"||ph=="ans")&&s<=5?"low":"";
 const mx=Math.max(...sc);
 for(let i=0;i<3;i++){const b=$("#b"+i);b.classList.toggle("lk",!!lock[i]);b.classList.toggle("on",cur==i&&ph=="ans");b.classList.toggle("lead",mx>0&&sc[i]==mx);b.querySelector(".sc").textContent=sc[i]}
 $("#st").textContent=msg;$("#go").hidden=ph!="ready";$("#nx").hidden=ph!="done";$("#ans").hidden=ph!="ans";$("#rv").hidden=ph!="done"}
setInterval(()=>{
 if(ph=="run"){const p=Math.ceil(left/10);left=Math.max(0,left-1);const n=Math.ceil(left/10);if(n<p&&n<=5&&n>0)snd.tick();if(left<=0){snd.up();done("Waktu habis")}draw()}
 else if(ph=="ans"){const p=Math.ceil(aleft/10);aleft=Math.max(0,aleft-1);const n=Math.ceil(aleft/10);if(n<p&&n<=3&&n>0)snd.tick();if(aleft<=0)wrong();else draw()}
},100);
</script></body></html>
